<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BistroFlow</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .auth-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 2rem; width: 100%; max-width: 420px; }
    .auth-card h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .auth-card p.sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .auth-tab { flex: 1; padding: 0.55rem; border: 1px solid var(--border); background: #fff; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; color: var(--text-muted); }
    .auth-tab.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
    .auth-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; padding: 0.6rem 0.8rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .auth-success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; padding: 0.6rem 0.8rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    form .form-group { margin-bottom: 0.9rem; }
    form input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; }
    form input:focus { outline: none; border-color: var(--primary); }
    .btn-block { width: 100%; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1>BistroFlow</h1>
    <p class="sub">Sign in to continue, or create a new customer account.</p>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin">Login</button>
      <button type="button" class="auth-tab" id="tabRegister">Create Account</button>
    </div>

    <div id="authError" class="auth-error"></div>
    <div id="authSuccess" class="auth-success"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary btn-block">Login</button>
    </form>

    <form id="registerForm" style="display:none">
      <div class="form-group">
        <label for="regName">Full Name *</label>
        <input type="text" id="regName" required>
      </div>
      <div class="form-group">
        <label for="regEmail">Email *</label>
        <input type="email" id="regEmail" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="regPhone">Phone</label>
        <input type="tel" id="regPhone">
      </div>
      <div class="form-group">
        <label for="regPassword">Password * (min 6 chars)</label>
        <input type="password" id="regPassword" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary btn-block">Create Account</button>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
